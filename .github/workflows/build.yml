name: Build APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: 云端编译 APK
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'

      - name: 安装 Gradle 7.6.4
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '7.6.4'

      - name: 准备签名密钥
        run: |
          if [ ! -f app/keystore.jks ]; then
            echo "仓库内未发现签名密钥，本次自动生成（每次生成签名不同，会导致覆盖安装失败）"
            keytool -genkeypair -v \
              -keystore app/keystore.jks \
              -storetype JKS \
              -alias tingshu \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass 123456 \
              -keypass 123456 \
              -dname "CN=tingshu, OU=dev, O=tingshu, L=Beijing, ST=Beijing, C=CN"
          else
            echo "使用仓库内自带的签名密钥（每次编译签名一致，可直接覆盖安装）"
          fi
          ls -l app/keystore.jks

      - name: 编译 Release APK
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: 列出产物
        if: always()
        run: find app/build/outputs -type f -name "*.apk" 2>/dev/null || true

      - name: 上传 APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: tingshu-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
