name: Build APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: 云端编译 APK
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'

      - name: 安装 Gradle 7.6.4
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '7.6.4'

      - name: 检查签名密钥与版本号
        run: |
          if [ ! -f app/keystore.jks ]; then
            echo "::error::缺少 app/keystore.jks。签名密钥必须与官方版一致，否则无法覆盖安装，构建终止。"
            exit 1
          fi
          echo "签名密钥："; ls -l app/keystore.jks
          echo "版本信息："; grep -E 'versionCode|versionName' app/build.gradle

      - name: 编译 Release APK
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: 校验 APK（完整性 / 对齐 / 签名）
        run: |
          set -e
          APK=app/build/outputs/apk/release/app-release.apk
          ls -l "$APK"

          echo "--- 1. ZIP 完整性 ---"
          unzip -t "$APK" | tail -2

          SDK="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          BT=$(ls -d "$SDK"/build-tools/*/ 2>/dev/null | sort -V | tail -1 || true)
          echo "build-tools: $BT"

          if [ -n "$BT" ] && [ -x "$BT/zipalign" ]; then
            echo "--- 2. 4 字节对齐 ---"
            "$BT/zipalign" -c -v 4 "$APK" | tail -2
          fi

          if [ -n "$BT" ] && [ -x "$BT/apksigner" ]; then
            echo "--- 3. 签名校验（必须全部 verified） ---"
            "$BT/apksigner" verify --verbose --print-certs "$APK"
          fi

          echo "--- 4. 摘要 ---"
          sha256sum "$APK"
          md5sum "$APK"

      - name: 生成发布文件
        run: |
          set -e
          VERSION=$(grep -oP '^\s*versionName\s+"\K[^"]+' app/build.gradle | head -1)
          CODE=$(grep -oP '^\s*versionCode\s+\K[0-9]+' app/build.gradle | head -1)
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "APKFILE=TingShu-ZeroAd-v${VERSION}.apk" >> "$GITHUB_ENV"
          cp app/build/outputs/apk/release/app-release.apk "TingShu-ZeroAd-v${VERSION}.apk"
          {
            echo "versionName: $VERSION"
            echo "versionCode: $CODE"
            echo ""
            sha256sum "TingShu-ZeroAd-v${VERSION}.apk"
            md5sum "TingShu-ZeroAd-v${VERSION}.apk"
          } | tee SHA256SUMS.txt

      - name: 上传 APK（Artifacts）
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: tingshu-release-apk
          path: |
            TingShu-ZeroAd-v*.apk
            SHA256SUMS.txt
          if-no-files-found: error

      - name: 发布到 Releases
        if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          TAG="v${VERSION}"
          cat > NOTES.md <<'EOF'
          ## 听书 清爽版（零广告）

          内置 34 个可用书源，无任何广告 SDK（穿山甲 / 快手 / 优量汇等 9 家联盟已全部剔除）。

          ### 下载与安装
          1. 点本页下方资源里的 **TingShu-ZeroAd-v*.apk** 下载（务必等下载完成，文件约 7.6 MB）
          2. 手机上点开安装；若提示「未知来源」，在系统设置里允许该浏览器/文件管理器安装应用
          3. 已装官方版可直接覆盖安装（签名与官方一致），无需先卸载

          ### 校验下载是否完整（推荐）
          下载后请对照同页 `SHA256SUMS.txt` 里的哈希值。
          如果手机装了「MT管理器」之类的工具，可直接查看文件的 SHA-256 比对；
          数值不一致说明下载被中断，请重新下载——下载不完整是安卓报
          「解析软件包时出现问题」最常见的原因。

          ### 说明
          - 包名 `com.github.eprendre.tingshu`，与官方版一致
          - 签名证书 SHA1：`25:05:8D:B6:E2:C2:7B:08:26:A8:F8:4C:5B:3F:48:70:1F:8E:8B:57`（与官方版相同）
          - 覆盖安装官方版后，由于数据库结构不同，收藏 / 历史会被重置一次
          - 界面与播放器源自开源项目 eprendre/tingshu（MIT）
          EOF
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG 已存在，覆盖上传资源"
            gh release upload "$TAG" "$APKFILE" SHA256SUMS.txt --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" "$APKFILE" SHA256SUMS.txt \
              --repo "$GITHUB_REPOSITORY" \
              --title "听书 清爽版 v${VERSION}（零广告）" \
              --notes-file NOTES.md \
              --latest
          fi
          echo "发布地址：https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG"
