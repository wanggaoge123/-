apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'
apply plugin: 'kotlin-kapt'
apply plugin: 'kotlin-android-extensions'

android {
    compileSdk 33

    defaultConfig {
        applicationId "com.github.eprendre.tingshu"
        minSdk 21
        targetSdk 33
        // 官方版当前为 2600（2.6.0）。这里必须严格大于它，
        // 否则在已装官方版的手机上属于「降级安装」，会被安卓拒绝。
        versionCode 2601
        versionName "2.6.1"
        multiDexEnabled true
        kapt {
            arguments {
                arg("room.schemaLocation", "$projectDir/schemas".toString())
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    kotlinOptions {
        jvmTarget = "11"
    }

    // 签名密钥不提交进仓库，由 CI 用 keytool 现场生成（见 .github/workflows/build.yml）。
    // 本地若自行放了 app/keystore.jks，会自动启用签名；没有则产出未签名 APK。
    def releaseKeystore = file('keystore.jks')
    def hasKeystore = releaseKeystore.exists()

    signingConfigs {
        if (hasKeystore) {
            release {
                storeFile releaseKeystore
                storePassword '123456'
                keyAlias 'tingshu'
                keyPassword '123456'
                // 三种签名方案全开，兼容 Android 5.0 ~ 最新系统
                enableV1Signing true
                enableV2Signing true
                enableV3Signing true
                enableV4Signing false
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (hasKeystore) {
                signingConfig signingConfigs.release
            }
        }
        debug {
            if (hasKeystore) {
                signingConfig signingConfigs.release
            }
        }
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }

    packagingOptions {
        resources.excludes += ['META-INF/*', 'META-INF/**']
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"
    implementation 'org.jetbrains.anko:anko-commons:0.10.8'

    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.9.0'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    // 注意：core-ktx 1.10.x 会拉入 kotlin-stdlib 1.8.10，与本项目的 Kotlin 1.7.21 冲突
    // （1.8 起 jdk7/jdk8 的类被并入 stdlib，会撞出 Duplicate class），故锁在 1.9.0。
    implementation 'androidx.core:core-ktx:1.9.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.palette:palette:1.0.0'
    implementation 'androidx.multidex:multidex:2.0.1'
    implementation 'androidx.preference:preference:1.2.1'
    implementation 'androidx.legacy:legacy-support-v4:1.0.0'

    // 播放器
    implementation 'com.google.android.exoplayer:exoplayer:2.9.6'
    implementation 'com.google.android.exoplayer:extension-mediasession:2.9.6'
    implementation 'androidx.media:media:1.2.1'

    // 响应式
    implementation 'io.reactivex.rxjava2:rxkotlin:2.4.0'
    implementation 'io.reactivex.rxjava2:rxjava:2.2.21'
    implementation 'io.reactivex.rxjava2:rxandroid:2.1.1'

    // 网络与解析
    // jsoup 必须用 1.13.1：书源代码里的 `.filter { }` 走的是 Kotlin 扩展，
    // 而 jsoup 1.15+ 给 Elements/Node 加了成员方法 filter(NodeFilter)（需要 2 个参数），
    // 会遮蔽扩展导致编译失败。此版本与官方书源框架保持一致。
    implementation 'org.jsoup:jsoup:1.13.1'
    implementation 'com.github.kittinunf.fuel:fuel:2.3.1'
    implementation 'com.github.kittinunf.fuel:fuel-json:2.3.1'
    implementation 'com.google.code.gson:gson:2.10.1'
    // okhttp 4.10+ 由 Kotlin 1.8 编译，元数据版本高于本项目编译器（1.7.21），锁在 4.9.3
    implementation 'com.squareup.okhttp3:okhttp:4.9.3'
    // commons-lang3 3.13+ 变成 multi-release jar，AGP 7.4 自带的 R8 处理时会抛 NPE
    // （mergeExtDexRelease 失败），锁在 3.12.0。
    implementation 'org.apache.commons:commons-lang3:3.12.0'

    // 图片
    implementation 'com.github.bumptech.glide:glide:4.16.0'
    kapt 'com.github.bumptech.glide:compiler:4.16.0'
    implementation 'jp.wasabeef:glide-transformations:4.3.0'

    // 数据库
    def room_version = "2.5.2"
    implementation "androidx.room:room-runtime:$room_version"
    implementation "androidx.room:room-ktx:$room_version"
    implementation "androidx.room:room-rxjava2:$room_version"
    kapt "androidx.room:room-compiler:$room_version"
}

// 依赖版本对齐（两个坑都由这里兜住）
configurations.all {
    resolutionStrategy {
        // 1) 固定 media 版本，避免新版移除 MediaButtonReceiver 导致清单校验失败
        force 'androidx.media:media:1.2.1'
        // 2) 强制 kotlin-stdlib 全家桶与编译器版本一致。
        //    Kotlin 1.8 起 kotlin-stdlib-jdk7/jdk8 的类被合并进 kotlin-stdlib，
        //    若与旧版 jdk7/jdk8 共存，会报 Duplicate class（checkReleaseDuplicateClasses 失败）。
        force "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"
        force "org.jetbrains.kotlin:kotlin-stdlib-jdk7:$kotlin_version"
        force "org.jetbrains.kotlin:kotlin-stdlib-jdk8:$kotlin_version"
    }
}
